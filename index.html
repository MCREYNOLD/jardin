<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Pour toi 🌹</title>
<style>
:root{--vin:#7a1030;--vin2:#4d0820;--or:#d4a63a;--or2:#ffe29a;--rose:#e84a85;--creme:#fff8ef;--texte:#5e0b27}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;min-height:100%}
body{font-family:system-ui,-apple-system,'Segoe UI',Roboto,Arial,sans-serif;color:var(--creme);overflow-x:hidden;
 background:radial-gradient(ellipse at 50% 30%,#6e1236 0,#3a0618 60%,#1a0210 100%) fixed;
 padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom)}
h1,h2{font-family:Georgia,'Times New Roman',serif}
#fond{position:fixed;inset:0;pointer-events:none;overflow:hidden}
#fond i{position:absolute;bottom:-40px;font-style:normal;opacity:.4;animation:monte linear infinite}
@keyframes monte{to{transform:translateY(-115vh) rotate(25deg)}}

main{position:relative;z-index:1;min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:16px 14px 24px;text-align:center}
h1{color:var(--or2);font-size:clamp(1.6rem,7vw,2.4rem);margin:0 0 2px;line-height:1.15;text-shadow:0 2px 14px rgba(0,0,0,.5)}
.sous{margin:0;color:#ffd0e1;font-weight:700}

/* ---------- Scène ---------- */
.scene{position:relative;width:320px;height:450px;margin-top:6px}
.podium{position:absolute;left:10px;bottom:34px;width:300px;height:76px;border-radius:50%;
 background:radial-gradient(ellipse,#a3163f,#6c0d2b);border:5px solid var(--or);
 box-shadow:0 0 0 5px rgba(212,166,58,.3),0 0 40px rgba(212,166,58,.45)}
.podium::after{content:"";position:absolute;inset:9px;border-radius:50%;border:2px solid rgba(212,166,58,.6)}
.cadeau{position:absolute;left:85px;bottom:78px;width:150px;height:144px;cursor:pointer;z-index:2}
.corps{position:absolute;bottom:0;left:0;width:150px;height:110px;z-index:2;border-radius:4px 4px 8px 8px;
 background:linear-gradient(90deg,#8e1235,#b01a45 50%,#8e1235);box-shadow:0 14px 22px rgba(0,0,0,.45)}
.corps::before{content:"";position:absolute;left:50%;top:0;bottom:0;width:22px;margin-left:-11px;background:linear-gradient(90deg,#b8862a,var(--or2),#b8862a)}
.corps s{position:absolute;text-decoration:none;font-size:15px;line-height:1}
.couvercle{position:absolute;left:-8px;bottom:108px;width:166px;height:36px;z-index:3;border-radius:5px;
 background:linear-gradient(#c01f4f,#8e1235);box-shadow:0 4px 8px rgba(0,0,0,.35);transition:transform 1s cubic-bezier(.4,0,.2,1),opacity 1s;transform-origin:0 100%}
.couvercle::before{content:"";position:absolute;left:50%;top:0;bottom:0;width:22px;margin-left:-11px;background:linear-gradient(90deg,#b8862a,var(--or2),#b8862a)}
.noeud{position:absolute;left:50%;top:-24px;width:0;height:0}
.noeud i{position:absolute;top:0;width:44px;height:26px;border:5px solid var(--or);border-radius:50%;background:rgba(255,226,154,.25)}
.noeud i:nth-child(1){left:-46px;transform:rotate(-20deg)}
.noeud i:nth-child(2){left:2px;transform:rotate(20deg)}
.noeud b{position:absolute;left:-8px;top:6px;width:16px;height:16px;border-radius:50%;background:var(--or2);box-shadow:0 2px 3px rgba(0,0,0,.4)}
.ouvert .couvercle{transform:translate(-130px,-60px) rotate(-38deg);opacity:0}
.indice{position:absolute;bottom:0;left:0;right:0;color:var(--or2);font-weight:700;animation:pouls 1.4s ease-in-out infinite}
.ouvert .indice{display:none}
@keyframes pouls{50%{transform:scale(1.07)}}

/* ---------- Bouquet ---------- */
.bouquet{position:absolute;left:0;bottom:50px;width:150px;height:196px;z-index:1;opacity:0;
 transform:translateY(30px) scale(.5);transition:transform 1.5s cubic-bezier(.2,1.3,.4,1) .5s,opacity .6s .5s}
.ouvert .bouquet{opacity:1;transform:translateY(-38px) scale(1)}
.feuille{position:absolute;width:44px;height:20px;border-radius:0 100% 0 100%;background:linear-gradient(#5fb36a,#2f7d3c)}
.rose{position:absolute;border-radius:50%;
 background:radial-gradient(circle at 42% 38%,#ffd1e1 0 10%,#ff9cc0 11% 28%,#f46a9f 29% 52%,#d81b60 53%);
 box-shadow:inset -5px -6px 9px rgba(110,0,45,.5),0 3px 6px rgba(0,0,0,.4)}
.rose::after{content:"";position:absolute;inset:0;border-radius:50%;
 background:conic-gradient(rgba(255,255,255,.4),transparent 22%,rgba(255,255,255,.28) 50%,transparent 75%,rgba(255,255,255,.35));
 -webkit-mask:radial-gradient(circle,transparent 18%,#000 20%);mask:radial-gradient(circle,transparent 18%,#000 20%)}
.ruban{position:absolute;left:50%;top:112px}
.ruban i{position:absolute;top:0;width:42px;height:26px;background:linear-gradient(#ffd6e6,#f58fb6);border-radius:50% 10% 50% 10%}
.ruban i:nth-child(1){left:-44px;transform:rotate(-12deg) scaleX(-1)}
.ruban i:nth-child(2){left:2px;transform:rotate(12deg)}
.ruban b{position:absolute;left:-9px;top:5px;width:18px;height:18px;border-radius:50%;background:#f58fb6;box-shadow:0 2px 3px rgba(0,0,0,.35)}
.etiq{position:absolute;left:84px;top:140px;background:#fff;color:#7a1030;font:600 12px 'Segoe Script','Bradley Hand','Comic Sans MS',cursive;padding:2px 8px;border-radius:3px;transform:rotate(-9deg);box-shadow:0 2px 4px rgba(0,0,0,.35)}

/* ---------- Ballons ---------- */
.ballons{position:absolute;inset:0;pointer-events:none;z-index:0}
.ballon{position:absolute;bottom:130px;width:42px;height:54px;border-radius:50% 50% 48% 48%;opacity:0;
 transform:translateY(0) scale(.2);box-shadow:inset -6px -8px 0 rgba(0,0,0,.15);
 display:flex;align-items:center;justify-content:center;font:700 26px Georgia,'Times New Roman',serif;color:#7a4c00}
.ballon::after{content:"";position:absolute;left:50%;top:100%;width:1px;height:70px;background:rgba(255,255,255,.55)}
.ballon.or{width:58px;height:74px;background:linear-gradient(135deg,#fff0b3,#d4a63a 60%,#a97a14)!important;font-size:38px}
.ouvert .ballon{animation:vole 2.4s cubic-bezier(.2,.8,.3,1) forwards,flotte 3s ease-in-out 2.4s infinite alternate}
@keyframes vole{to{opacity:1;transform:translateY(var(--h)) scale(1)}}
@keyframes flotte{from{transform:translateY(var(--h)) translateX(-6px)}to{transform:translateY(calc(var(--h) - 12px)) translateX(6px)}}

.etincelle{position:absolute;pointer-events:none;z-index:4;animation:scint 1.8s ease-out forwards}
@keyframes scint{0%{opacity:0;transform:scale(.2)}25%{opacity:1}100%{opacity:0;transform:translate(var(--dx),-70px) scale(1)}}
.chute{position:fixed;top:-30px;z-index:50;pointer-events:none;animation:tombe linear forwards}
@keyframes tombe{to{transform:translateY(112vh) rotate(540deg)}}

/* ---------- Boutons ---------- */
button{font:inherit;cursor:pointer;border:0}
.btn{color:#5a3a00;font-weight:700;padding:13px 24px;border-radius:30px;font-size:1rem;
 background:linear-gradient(#fff0b3,#d4a63a);box-shadow:0 5px 0 #8f6710,0 10px 18px rgba(0,0,0,.4);transition:transform .15s}
.btn:active{transform:translateY(4px)}
.btn:disabled{opacity:.7}
#bSuite:disabled{filter:grayscale(.7);cursor:not-allowed}
#bLettre{display:none;margin-top:4px;animation:pouls 1.4s ease-in-out infinite}

/* ---------- Fenêtres ---------- */
.voile{position:fixed;inset:0;background:rgba(20,0,10,.7);display:none;align-items:center;justify-content:center;padding:14px;z-index:10}
.voile.on{display:flex}
.fenetre{position:relative;background:linear-gradient(#fffdf8,#fdeee6);color:var(--texte);border:3px solid var(--or);
 border-radius:20px;width:min(100%,400px);max-height:94vh;overflow:auto;padding:42px 16px 18px;text-align:center;
 box-shadow:0 20px 60px rgba(0,0,0,.6),0 0 0 4px rgba(212,166,58,.25)}
.medaillon{position:absolute;top:-2px;left:50%;transform:translateX(-50%);width:34px;height:34px;border-radius:0 0 50% 50%;
 background:var(--or);display:flex;align-items:center;justify-content:center;font-size:.95rem}
.fermer{position:absolute;top:8px;right:10px;z-index:2;width:30px;height:30px;border-radius:50%;background:#f6e3d6;color:var(--texte)}
.fenetre h2{margin:0 0 6px;font-size:1.4rem;color:var(--vin)}
.pre{margin:0 0 4px;font-size:.72rem;color:#a07a1c;font-weight:700}
.aide{margin:0 0 12px;font-size:.85rem}
.papier{font-family:'Segoe Script','Bradley Hand','Comic Sans MS',cursive;font-size:1.45rem;line-height:1.55;margin:8px 0 6px;
 background:repeating-linear-gradient(transparent 0 33px,#ecd9c8 33px 34px)}
.papier p{margin:0 0 8px}
.signe{text-align:right;font-size:1.15rem;color:var(--vin);margin-top:4px}
.fenetre .btn{margin-top:14px;width:100%}
.btn.vin{background:linear-gradient(#a3163f,#5e0b27);color:var(--or2);box-shadow:0 5px 0 #3a0618,0 10px 18px rgba(0,0,0,.3)}

.grille{display:grid;grid-template-columns:repeat(3,1fr);gap:9px;padding:9px;border:2px solid var(--or);border-radius:14px;background:#fff3ea}
.carte{aspect-ratio:1;perspective:500px;background:none;padding:0}
.carte .int{position:relative;width:100%;height:100%;transition:transform .6s;transform-style:preserve-3d}
.carte.vue .int{transform:rotateY(180deg)}
.carte .f{position:absolute;inset:0;border-radius:11px;backface-visibility:hidden;-webkit-backface-visibility:hidden;
 display:flex;align-items:center;justify-content:center;font-size:1.9rem;overflow:hidden;box-shadow:0 2px 5px rgba(0,0,0,.2)}
.carte .d{transform:rotateY(180deg);background-size:cover;background-position:center}
.legende{margin:12px 0 0;min-height:66px;background:#fff;border:2px solid #f0cfb8;border-radius:14px;padding:10px 12px;
 font-style:italic;font-size:.92rem;display:flex;align-items:center;justify-content:center}

.liste{display:flex;flex-direction:column;gap:8px;text-align:left}
.liste label{display:flex;align-items:center;gap:10px;background:#fff;border:2px solid #f0cfb8;border-radius:14px;padding:10px 12px;cursor:pointer;font-size:.92rem}
.liste input{position:absolute;opacity:0}
.liste .n{flex:none;width:30px;height:30px;border-radius:50%;background:#f6e3d6;color:var(--vin);font-weight:700;display:flex;align-items:center;justify-content:center;transition:.2s}
.liste input:checked + .n{background:var(--vin);color:var(--or2);transform:scale(1.1)}
.liste input:checked ~ .t{font-weight:700}
.liste label:has(input:checked){border-color:var(--vin);background:#fff1f5}
.liste input:focus-visible + .n{outline:3px solid var(--or)}
#msg{min-height:1.3em;margin:10px 0 0;font-weight:700;font-size:.9rem}
.cache{display:none!important}
@media (prefers-reduced-motion:reduce){*{animation-duration:.01s!important;transition-duration:.01s!important}}
</style>
</head>
<body>
<div id="fond"></div>

<main>
  <h1 id="titre"></h1>
  <p class="sous">19 novembre · 20 ans 🎂</p>

  <div class="scene" id="scene">
    <div class="ballons" id="ballons"></div>
    <div class="podium"></div>
    <div class="cadeau" id="cadeau" role="button" tabindex="0" aria-label="Ouvrir le cadeau">
      <div class="bouquet" id="bouquet">
        <div class="ruban"><i></i><i></i><b></b></div>
        <div class="etiq">Pour toi</div>
      </div>
      <div class="corps" id="corps"></div>
      <div class="couvercle"><div class="noeud"><i></i><i></i><b></b></div></div>
    </div>
    <div class="indice">Touche le cadeau 🎁</div>
  </div>
  <button class="btn" id="bLettre">Lire ma lettre ✉️</button>
</main>

<!-- Lettre -->
<div class="voile" id="vLettre">
  <div class="fenetre" role="dialog" aria-modal="true">
    <div class="medaillon">🌸</div>
    <p class="pre">Un détail spécial pour toi</p>
    <h2 id="dest"></h2>
    <div class="papier" id="lettre"></div>
    <div class="signe" id="signe"></div>
    <button class="btn vin" id="bPluie">Envoyer une pluie de bonheur ✨</button>
  </div>
</div>

<!-- Album + souhaits -->
<div class="voile" id="vAlbum">
  <div class="fenetre" role="dialog" aria-modal="true">
    <div class="medaillon">🎁</div>
    <button class="fermer" id="fermer" aria-label="Fermer">✕</button>

    <section id="etape1">
      <h2>Parce que tu mérites tout ce qu'il y a de beau</h2>
      <p class="aide">Touche chaque carte pour la retourner et découvrir un message ✨</p>
      <div class="grille" id="grille"></div>
      <div class="legende" id="legende">Touche une carte pour commencer ✨</div>
      <button class="btn vin" id="bSuite" disabled>Encore 6 cartes à découvrir 🎴</button>
    </section>

    <section id="etape2" class="cache">
      <h2>Fais tes souhaits</h2>
      <p class="aide">Coche ceux qui te plaisent, je m'en occupe 🎁</p>
      <form id="form" class="liste"></form>
      <p id="msg"></p>
      <button class="btn vin" id="bEnvoi" type="button">Envoyer mes souhaits 💌</button>
    </section>
  </div>
</div>

for (let i = 0; i < 8; i++) {
  const c = document.createElement("i");
  c.textContent = ["🌸","✨","💛","🌹"][i % 4];
  c.style.left = rnd(0, 100) + "%";
  c.style.fontSize = rnd(14, 34) + "px";
  c.style.animationDuration = rnd(10, 20) + "s";
  c.style.animationDelay = -rnd(0, 18) + "s";
  $("#fond").appendChild(c);
}

/* Cœurs sur le cadeau */
const coeurs = ["✨","🌸","🎉","✨","🌸","🎉"];
[[14,12],[14,44],[14,76],[112,12],[112,44],[112,76]].forEach(([x, y], i) => {
  const s = document.createElement("s");
  s.textContent = coeurs[i]; s.style.left = x + "px"; s.style.top = y + "px";
  $("#corps").appendChild(s);
});

/* Bouquet : feuilles + roses */
const bq = $("#bouquet");
[[-6,70,-35],[100,70,35],[10,90,-15],[88,92,15]].forEach(([x, y, r]) => {
  const f = document.createElement("div");
  f.className = "feuille"; f.style.cssText = `left:${x}px;top:${y}px;transform:rotate(${r}deg)`;
  bq.prepend(f);
});
[[50,0,50],[6,22,50],[94,22,50],[28,38,58],[66,38,58],[2,64,44],[104,64,44],[50,62,52]].forEach(([x, y, s]) => {
  const r = document.createElement("div");
  r.className = "rose"; r.style.cssText = `left:${x}px;top:${y}px;width:${s}px;height:${s}px`;
  bq.appendChild(r);
});

/* Ballons : 6 roses/rouges + deux ballons dorés « 2 » et « 0 » */
const defs = [
  ["#e53935",8],["#ff80ab",262],["#ffffff",30],["#f06292",236],["#b388ff",60],["#d81b60",208],
  ["or",118,"2"],["or",168,"0"]
];
defs.forEach(([c, x, t], i) => {
  const b = document.createElement("div");
  b.className = "ballon" + (c === "or" ? " or" : "");
  if (c !== "or") b.style.background = c;
  b.textContent = t || "";
  b.style.left = x + "px";
  b.style.setProperty("--h", -(c === "or" ? 212 + (i % 2) * 22 : 120 + (i % 3) * 55 + rnd(0, 20)) + "px");
  b.style.animationDelay = (0.5 + i * 0.13) + "s," + (2.9 + i * 0.13) + "s";
  $("#ballons").appendChild(b);
});

/* Pluie de cœurs / confettis */
function pluie(n = 60, symboles = ["🌸","🌹","💛","🎉","✨","🎈"]) {
  for (let i = 0; i < n; i++) {
    const e = document.createElement("div");
    e.className = "chute";
    e.textContent = symboles[i % symboles.length];
    e.style.left = rnd(0, 96) + "vw";
    e.style.fontSize = rnd(16, 34) + "px";
    e.style.animationDuration = rnd(2.4, 5) + "s";
    e.style.animationDelay = rnd(0, 1.4) + "s";
    document.body.appendChild(e);
    setTimeout(() => e.remove(), 7000);
  }
}

/* Étincelles autour du bouquet */
function etincelles(duree = 5000) {
  const fin = Date.now() + duree;
  const t = setInterval(() => {
    if (Date.now() > fin) return clearInterval(t);
    const e = document.createElement("div");
    e.className = "etincelle";
    e.textContent = ["✨","💛","🌸","✦"][Math.floor(rnd(0, 4))];
    e.style.left = rnd(40, 260) + "px";
    e.style.bottom = rnd(180, 340) + "px";
    e.style.fontSize = rnd(12, 22) + "px";
    e.style.setProperty("--dx", rnd(-30, 30) + "px");
    $("#scene").appendChild(e);
    setTimeout(() => e.remove(), 1900);
  }, 160);
}

/* Ouverture du cadeau */
let ouvert = false;
function ouvrir() {
  if (ouvert) return;
  ouvert = true;
  $("#scene").classList.add("ouvert");
  pluie(40, ["🎊","🌸","💛","✨"]);
  setTimeout(() => etincelles(), 900);
  setTimeout(() => { $("#bLettre").style.display = "inline-block"; }, 2800);
}
$("#cadeau").onclick = ouvrir;
$("#cadeau").addEventListener("keydown", e => {
  if (e.key === "Enter" || e.key === " ") { e.preventDefault(); ouvrir(); }
});

/* Lettre → pluie d'amour → album */
$("#bLettre").onclick = () => $("#vLettre").classList.add("on");
$("#bPluie").onclick = () => {
  $("#bPluie").disabled = true;
  pluie(80);
  setTimeout(() => {
    $("#vLettre").classList.remove("on");
    $("#vAlbum").classList.add("on");
  }, 2600);
};
$("#fermer").onclick = () => $("#vAlbum").classList.remove("on");

/* Cartes à retourner */
EMOJIS.forEach((e, i) => {
  const c = document.createElement("button");
  c.className = "carte";
  c.setAttribute("aria-label", "Carte " + (i + 1));
  const dos = PHOTOS[i]
    ? `background-image:url('${PHOTOS[i]}')`
    : "background:linear-gradient(135deg,#ffb3c9,#e84a85)";
  c.innerHTML = `<div class="int">
    <div class="f" style="background:${COULEURS[i]}">${e}</div>
    <div class="f d" style="${dos}">${PHOTOS[i] ? "" : "💌"}</div></div>`;
  c.onclick = () => {
    c.classList.add("vue");
    $("#legende").textContent = MESSAGES[i];
    const reste = EMOJIS.length - document.querySelectorAll(".carte.vue").length;
    const b = $("#bSuite");
    if (reste > 0) {
      b.textContent = "Encore " + reste + " carte" + (reste > 1 ? "s" : "") + " à découvrir 🎴";
    } else {
      b.disabled = false;
      b.textContent = "Faire mes souhaits 🎁";
    }
  };
  $("#grille").appendChild(c);
});
$("#bSuite").onclick = () => {
  $("#etape1").classList.add("cache");
  $("#etape2").classList.remove("cache");
};

/* Souhaits numérotés */
const form = $("#form");
SOUHAITS.forEach((s, i) => {
  const l = document.createElement("label");
  l.innerHTML = `<input type="checkbox" value="${i + 1}"><span class="n">${i + 1}</span><span class="t">${s}</span>`;
  form.appendChild(l);
});

/* Envoi Formspree */
let envoye = false;
$("#bEnvoi").onclick = async () => {
  const msg = $("#msg"), btn = $("#bEnvoi");
  const coches = [...form.querySelectorAll("input:checked")].map(x => +x.value);
  if (!coches.length) { msg.textContent = "Coche au moins un souhait 🎁"; return; }
  if (envoye) return;
  btn.textContent = "Envoi en cours… ✨"; btn.disabled = true;
  try {
    const r = await fetch(FORMSPREE_URL, {
      method: "POST",
      headers: { "Content-Type": "application/json", "Accept": "application/json" },
      body: JSON.stringify({
        _subject: "🎂 Ses souhaits d'anniversaire : " + coches.join(", "),
        numeros_coches: coches.join(", "),
        details: coches.map(n => n + ". " + SOUHAITS[n - 1]).join("\n")
      })
    });
    if (!r.ok) throw new Error("HTTP " + r.status);
    envoye = true;
    msg.textContent = "C'est envoyé ! Merci, je note tout 🎁";
    btn.textContent = "Envoyé ✓";
    pluie(70);
  } catch (err) {
    msg.textContent = "Oups, l'envoi a échoué. Vérifie ta connexion et réessaie 💔";
    btn.textContent = "Réessayer 💌"; btn.disabled = false;
  }
};
</script>
</body>
</html>
